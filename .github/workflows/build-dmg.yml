name: Build and Package DMG

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Release
        run: swift build -c release

      - name: Package App Bundle
        run: |
          APP_DIR="build/ClipVault.app"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp .build/release/ClipVault "$APP_DIR/Contents/MacOS/ClipVault"
          cp Resources/Info.plist "$APP_DIR/Contents/Info.plist"
          cp Resources/ClipVault.icns "$APP_DIR/Contents/Resources/ClipVault.icns"
          cp Resources/StatusIcon.png "$APP_DIR/Contents/Resources/StatusIcon.png"
          cp Resources/StatusIcon@2x.png "$APP_DIR/Contents/Resources/StatusIcon@2x.png"
          codesign --force --sign "-" "$APP_DIR"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          mkdir -p dist
          create-dmg \
            --volname "ClipVault" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "dist/ClipVault.dmg" \
            "build/ClipVault.app"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-dmg
          path: dist/ClipVault.dmg

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-app
          path: build/ClipVault.app

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipVault.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
